<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="owlBody" x1="24" y1="4" x2="24" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#6EE800"/>
      <stop offset="100%" stopColor="#48A902"/>
    </linearGradient>
    <linearGradient id="owlBelly" x1="24" y1="20" x2="24" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#8EFC24"/>
      <stop offset="100%" stopColor="#5ED402"/>
    </linearGradient>
  </defs>
  <!-- Feet -->
  <ellipse cx="18" cy="44" rx="4" ry="2" fill="#FF9600"/>
  <ellipse cx="30" cy="44" rx="4" ry="2" fill="#FF9600"/>
  <!-- Main Body -->
  <rect x="6" y="6" width="36" height="36" rx="18" fill="url(#owlBody)"/>
  <ellipse cx="24" cy="32" rx="12" ry="9" fill="url(#owlBelly)"/>
  <!-- Eyes -->
  <circle cx="16" cy="18" r="7.5" fill="#FFFFFF"/>
  <circle cx="32" cy="18" r="7.5" fill="#FFFFFF"/>
  <!-- Pupils -->
  <circle cx="17.5" cy="18" r="4" fill="#0F172A"/>
  <circle cx="30.5" cy="18" r="4" fill="#0F172A"/>
  <!-- Catchlights -->
  <circle cx="19" cy="16.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="32" cy="16.5" r="1.5" fill="#FFFFFF"/>
  <!-- Beak -->
  <polygon points="24,22 19.5,28 28.5,28" fill="#FF9600"/>
  <polygon points="24,23 20.5,27.5 27.5,27.5" fill="#FFB444"/>
</svg>
