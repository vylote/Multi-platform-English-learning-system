<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="gemTop" x1="24" y1="6" x2="24" y2="17" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#7EE2FF"/>
      <stop offset="100%" stopColor="#1CB0F6"/>
    </linearGradient>
    <linearGradient id="gemFront" x1="24" y1="17" x2="24" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#1CB0F6"/>
      <stop offset="100%" stopColor="#0B79B5"/>
    </linearGradient>
    <linearGradient id="gemLeft" x1="12" y1="17" x2="24" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0F93D6"/>
      <stop offset="100%" stopColor="#045A8A"/>
    </linearGradient>
    <linearGradient id="gemRight" x1="36" y1="17" x2="24" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#3CD0FF"/>
      <stop offset="100%" stopColor="#1592D0"/>
    </linearGradient>
    <filter id="gemGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" floodColor="#1CB0F6" floodOpacity="0.4"/>
    </filter>
  </defs>
  <!-- Base Shadow -->
  <ellipse cx="24" cy="44" rx="15" ry="3" fill="#000000" fill-opacity="0.15"/>
  <!-- Top Table Facet -->
  <polygon points="16,6 32,6 38,17 10,17" fill="url(#gemTop)" filter="url(#gemGlow)"/>
  <!-- Top Side Facets -->
  <polygon points="6,17 16,6 10,17" fill="#4AC7FF"/>
  <polygon points="42,17 32,6 38,17" fill="#1598DC"/>
  <!-- Bottom Center Facet -->
  <polygon points="10,17 38,17 24,42" fill="url(#gemFront)"/>
  <!-- Bottom Left Facet -->
  <polygon points="6,17 10,17 24,42" fill="url(#gemLeft)"/>
  <!-- Bottom Right Facet -->
  <polygon points="42,17 38,17 24,42" fill="url(#gemRight)"/>
  <!-- Sparkle Highlight -->
  <polygon points="18,17 22,17 20,24" fill="#FFFFFF" fill-opacity="0.6"/>
  <circle cx="16" cy="11" r="1.5" fill="#FFFFFF"/>
</svg>
